    // =====================================================================
    // SEÇÃO 10: BUSCA INTERNA NO PDF E DESTAQUES VISUAIS
    // - Varre o texto das páginas via PDF.js, navega entre ocorrências
    //   e projeta caixas de destaque sobre o documento.
    // =====================================================================
    function togglePdfSearchBar() {
      const bar = document.getElementById('readerSearchBar');
      const btn = document.getElementById('pdfSearchToggleBtn');
      const isOpen = bar.classList.toggle('open');
      btn.classList.toggle('active-tool', isOpen);
      if (isOpen) {
        const input = document.getElementById('pdfSearchInput');
        input.focus();
        input.select();
      } else {
        clearPdfSearchHighlights();
      }
    }

    function closePdfSearchBar() {
      document.getElementById('readerSearchBar').classList.remove('open');
      document.getElementById('pdfSearchToggleBtn').classList.remove('active-tool');
      clearPdfSearchHighlights();
    }

    function clearPdfSearchHighlights() {
      pdfSearchQuery = '';
      pdfSearchMatches = [];
      currentMatchIdx = -1;
      document.getElementById('searchMatchCount').textContent = '0/0';
      document.getElementById('searchPrevBtn').disabled = true;
      document.getElementById('searchNextBtn').disabled = true;
      document.querySelectorAll('.pdf-search-highlight').forEach(el => el.remove());
    }

    function handlePdfSearchKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = e.target.value.trim();
        if (val === pdfSearchQuery && pdfSearchMatches.length > 0) {
          stepSearchMatch(e.shiftKey ? -1 : 1);
        } else {
          executePdfTextSearch(val);
        }
        return;
      }
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        executePdfTextSearch(e.target.value.trim());
      }, 350);
    }

    async function executePdfTextSearch(rawTerm) {
      if (!pdfInstance) return;
      const normTerm = normalizeText(rawTerm);
      pdfSearchQuery = rawTerm;
      pdfSearchMatches = [];
      currentMatchIdx = -1;

      if (!normTerm || normTerm.length < 2) {
        document.getElementById('searchMatchCount').textContent = '0/0';
        document.getElementById('searchPrevBtn').disabled = true;
        document.getElementById('searchNextBtn').disabled = true;
        refreshVisibleSearchHighlights();
        return;
      }

      const countLabel = document.getElementById('searchMatchCount');
      countLabel.textContent = '...';

      for (let p = 1; p <= pdfInstance.numPages; p++) {
        if (pdfSearchQuery !== rawTerm) return;
        try {
          const page = await pdfInstance.getPage(p);
          const textContent = await page.getTextContent();
          for (const item of textContent.items) {
            if (!item.str) continue;
            const normStr = normalizeText(item.str);
            if (normStr.includes(normTerm)) {
              const tx = item.transform;
              const x = tx[4];
              const y = tx[5];
              const w = item.width || (item.str.length * 5);
              const h = Math.max(Math.hypot(tx[2], tx[3]), item.height || 10);
              pdfSearchMatches.push({
                pageNum: p,
                rectPdf: [x, y - h * 0.2, x + w, y + h * 1.05]
              });
            }
          }
        } catch (e) {}
      }

      if (pdfSearchQuery !== rawTerm) return;

      const total = pdfSearchMatches.length;
      document.getElementById('searchPrevBtn').disabled = total === 0;
      document.getElementById('searchNextBtn').disabled = total === 0;

      if (total === 0) {
        countLabel.textContent = '0/0';
        refreshVisibleSearchHighlights();
        return;
      }

      const firstFromCurrent = pdfSearchMatches.findIndex(m => m.pageNum >= currentPage);
      currentMatchIdx = firstFromCurrent >= 0 ? firstFromCurrent : 0;
      await focusCurrentSearchMatch();
    }

    async function stepSearchMatch(delta) {
      if (!pdfSearchMatches.length) return;
      currentMatchIdx = (currentMatchIdx + delta + pdfSearchMatches.length) % pdfSearchMatches.length;
      await focusCurrentSearchMatch();
    }

    async function focusCurrentSearchMatch() {
      if (currentMatchIdx < 0 || currentMatchIdx >= pdfSearchMatches.length) return;
      const match = pdfSearchMatches[currentMatchIdx];
      document.getElementById('searchMatchCount').textContent = `${currentMatchIdx + 1}/${pdfSearchMatches.length}`;

      if (match.pageNum !== currentPage || readerPrefs.flow === 'single') {
        await jumpToPageAsync(match.pageNum);
      }

      setTimeout(() => {
        refreshVisibleSearchHighlights();
        const activeHl = document.querySelector('.pdf-search-highlight.active-match');
        if (activeHl) {
          activeHl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        }
      }, 140);
    }

    function refreshVisibleSearchHighlights() {
      document.querySelectorAll('.page-wrapper').forEach(wrapper => {
        const pNum = parseInt(wrapper.dataset.page);
        const layer = wrapper.querySelector('.pdf-overlay-layer');
        if (!layer) return;
        layer.querySelectorAll('.pdf-search-highlight').forEach(el => el.remove());

        if (!pdfSearchMatches.length) return;
        const scale = parseFloat(wrapper.dataset.renderScale || '1');
        const pageHeightPdf = parseFloat(wrapper.dataset.pdfHeight || '0');
        if (!pageHeightPdf) return;

        pdfSearchMatches.forEach((m, idx) => {
          if (m.pageNum !== pNum) return;
          const [x1, y1, x2, y2] = m.rectPdf;
          const left = x1 * scale;
          const top = (pageHeightPdf - y2) * scale;
          const width = Math.max(8, (x2 - x1) * scale);
          const height = Math.max(10, (y2 - y1) * scale);

          const mark = document.createElement('div');
          mark.className = 'pdf-search-highlight' + (idx === currentMatchIdx ? ' active-match' : '');
          mark.style.left = `${left}px`;
          mark.style.top = `${top}px`;
          mark.style.width = `${width}px`;
          mark.style.height = `${height}px`;
          layer.appendChild(mark);
        });
      });
    }

    // =====================================================================
    // SEÇÃO 11: MOTOR DE RENDERIZAÇÃO PDF, HIPERLINKS E PAGINAÇÃO
    // - Abre o leitor, extrai sumário/anotações, renderiza páginas sob demanda
    //   (lazy/virtualização) e gerencia zoom, troca de página e progresso.
    // =====================================================================
    function getRelativePageScrollRatio() {
      const area = document.getElementById('canvasArea');
      const el = document.querySelector(`.page-wrapper[data-page="${currentPage}"]`);
      if (!area || !el || el.offsetHeight <= 0) return 0;
      const offsetWithinPage = area.scrollTop - el.offsetTop;
      return Math.max(0, Math.min(0.95, offsetWithinPage / el.offsetHeight));
    }

    async function openIntegratedReader(id) {
      const doc = mergedDocs.find(d => d.id === id);
      if (!doc) return;

      if (!doc.arquivoBlob && doc.arquivo) {
        await downloadSingleDoc(id);
      }
      if (!doc.arquivoBlob) return;

      if (doc.formato !== 'pdf' || !window.pdfjsLib) {
        openExternalReader(id);
        return;
      }

      activeDoc = doc;
      if (!activeDoc.marcadores) activeDoc.marcadores = [];
      zoomMultiplier = 1.0;
      lockedScrollLeft = 0;
      lastScrollTop = 0;
      clearPdfSearchHighlights();
      document.getElementById('pdfSearchInput').value = '';
      document.getElementById('readerSearchBar').classList.remove('open');
      document.getElementById('pdfSearchToggleBtn').classList.remove('active-tool');

      const overlay = document.getElementById('readerOverlay');
      overlay.classList.remove('immersive', 'hud-visible');
      overlay.classList.add('open');

      document.getElementById('readerTitle').textContent = doc.titulo;
      updateBookmarksCounter();
      applyReaderPreferencesUI();
      requestScreenWakeLock();

      const arrayBuffer = await doc.arquivoBlob.arrayBuffer();
      pdfInstance = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      await loadPdfOutline(pdfInstance);

      doc.totalPaginas = pdfInstance.numPages;
      currentPage = Math.min(Math.max(1, doc.paginaAtual || 1), pdfInstance.numPages);

      document.getElementById('totalPagesSpan').textContent = `de ${pdfInstance.numPages}`;
      document.getElementById('pageInput').max = pdfInstance.numPages;

      await rebuildReaderViewport(currentPage, 0);
    }

    async function resolvePdfDestinationPage(dest) {
      if (!pdfInstance || !dest) return null;
      try {
        let resolvedDest = dest;
        if (typeof resolvedDest === 'string') {
          resolvedDest = await pdfInstance.getDestination(resolvedDest);
        }
        if (Array.isArray(resolvedDest) && resolvedDest[0]) {
          const idx = await pdfInstance.getPageIndex(resolvedDest[0]);
          return idx + 1;
        }
      } catch (e) {}
      return null;
    }

    async function loadPdfOutline(pdf) {
      pdfOutlineItems = [];
      try {
        const rawOutline = await pdf.getOutline();
        if (!rawOutline || !rawOutline.length) return;

        async function flatten(items, level = 0) {
          for (const item of items) {
            const pageNum = await resolvePdfDestinationPage(item.dest);
            pdfOutlineItems.push({
              title: item.title || 'Seção',
              page: pageNum,
              level: Math.min(level, 3)
            });
            if (item.items && item.items.length > 0) {
              await flatten(item.items, level + 1);
            }
          }
        }
        await flatten(rawOutline);
      } catch (e) {}
    }

    async function rebuildReaderViewport(targetPage, relativeRatio = 0) {
      if (!pdfInstance || !activeDoc) return;

      renderGeneration++;
      const currentGen = renderGeneration;
      isProgrammaticScroll = true;
      lastScrollTop = 0;

      if (lazyObserver) lazyObserver.disconnect();
      if (activePageObserver) activePageObserver.disconnect();

      const area = document.getElementById('canvasArea');
      const prevScrollLeft = area.scrollLeft;
      area.querySelectorAll('canvas').forEach(c => { c.width = 0; c.height = 0; });
      area.innerHTML = '';

      await new Promise(r => requestAnimationFrame(r));
      if (currentGen !== renderGeneration) return;

      lastKnownCanvasWidth = area.clientWidth;

      const samplePage = await pdfInstance.getPage(targetPage);
      const unscaled = samplePage.getViewport({ scale: 1 });
      const availWidth = Math.max(200, area.clientWidth - 20);
      const availHeight = Math.max(160, area.clientHeight - 20);

      let baseScale;
      if (readerPrefs.fitMode === 'page') {
        baseScale = Math.min(availWidth / unscaled.width, availHeight / unscaled.height);
      } else if (readerPrefs.fitMode === 'crop') {
        baseScale = (availWidth / unscaled.width) * 1.25;
      } else {
        baseScale = availWidth / unscaled.width;
      }

      const finalScale = baseScale * zoomMultiplier;
      const fullWidth = Math.round(unscaled.width * finalScale);
      const estHeight = Math.round(unscaled.height * finalScale);

      const cropToAvail = readerPrefs.fitMode === 'crop' && zoomMultiplier <= 1.02;
      const wrapperWidth = cropToAvail ? Math.min(fullWidth, availWidth) : fullWidth;

      if (readerPrefs.flow === 'single') {
        const wrapper = createPageWrapper(targetPage, wrapperWidth, estHeight);
        wrapper.dataset.rendered = 'true';
        area.appendChild(wrapper);
        await renderPageIntoWrapper(targetPage, wrapper, finalScale, currentGen, cropToAvail ? availWidth : null);
        area.scrollTo({
          top: Math.round(estHeight * relativeRatio),
          left: readerPrefs.locked ? lockedScrollLeft : prevScrollLeft
        });
        updateCurrentPageState(targetPage);
        setTimeout(() => { isProgrammaticScroll = false; }, 120);
      } else {
        for (let p = 1; p <= pdfInstance.numPages; p++) {
          area.appendChild(createPageWrapper(p, wrapperWidth, estHeight));
        }

        lazyObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            const pNum = parseInt(entry.target.dataset.page);
            if (entry.isIntersecting) {
              if (!entry.target.dataset.rendered) {
                entry.target.dataset.rendered = 'true';
                renderPageIntoWrapper(pNum, entry.target, finalScale, currentGen, cropToAvail ? availWidth : null);
              }
            } else if (entry.target.dataset.rendered === 'true') {
              const oldCanvas = entry.target.querySelector('canvas');
              if (oldCanvas) {
                oldCanvas.width = 0;
                oldCanvas.height = 0;
              }
              entry.target.innerHTML = `<span class="page-placeholder-label">Página ${pNum}</span>`;
              entry.target.dataset.rendered = '';
            }
          });
        }, { root: area, rootMargin: '1100px' });

        activePageObserver = new IntersectionObserver((entries) => {
          if (isProgrammaticScroll) return;
          let bestPage = null;
          let maxRatio = 0;
          entries.forEach((entry) => {
            if (entry.isIntersecting && entry.intersectionRatio > maxRatio) {
              maxRatio = entry.intersectionRatio;
              bestPage = parseInt(entry.target.dataset.page);
            }
          });
          if (bestPage && bestPage !== currentPage) {
            updateCurrentPageState(bestPage);
          }
        }, { root: area, threshold: [0.15, 0.4, 0.7] });

        document.querySelectorAll('.page-wrapper').forEach(el => {
          lazyObserver.observe(el);
          activePageObserver.observe(el);
        });

        const targetEl = document.querySelector(`.page-wrapper[data-page="${targetPage}"]`);
        if (targetEl) {
          if (readerPrefs.direction === 'horizontal') {
            targetEl.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });
          } else {
            area.scrollTop = targetEl.offsetTop + Math.round(targetEl.offsetHeight * relativeRatio) - 10;
            if (readerPrefs.locked) {
              area.scrollLeft = lockedScrollLeft;
            }
          }
        }
        updateCurrentPageState(targetPage);
        setTimeout(() => { isProgrammaticScroll = false; }, 220);
      }
    }

    function handleOrientationOrResize() {
      if (!activeDoc || !pdfInstance) return;
      const area = document.getElementById('canvasArea');
      if (!area) return;

      const currentWidth = area.clientWidth;
      if (Math.abs(currentWidth - lastKnownCanvasWidth) < 25) return;

      clearTimeout(resizeDebounceTimer);
      resizeDebounceTimer = setTimeout(() => {
        const ratio = getRelativePageScrollRatio();
        rebuildReaderViewport(currentPage, ratio);
      }, 180);
    }

    window.addEventListener('resize', handleOrientationOrResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleOrientationOrResize, 220);
    });

    function createPageWrapper(pageNum, width, height) {
      const div = document.createElement('div');
      div.className = 'page-wrapper';
      div.dataset.page = pageNum;
      div.style.width = `${width}px`;
      div.style.height = `${height}px`;
      div.innerHTML = `<span class="page-placeholder-label">Página ${pageNum}</span>`;
      return div;
    }

    async function renderAnnotationsAndOverlays(page, cssViewport, wrapper, cssWidth, cssHeight, gen) {
      const overlayLayer = document.createElement('div');
      overlayLayer.className = 'pdf-overlay-layer';
      overlayLayer.style.width = `${cssWidth}px`;
      overlayLayer.style.height = `${cssHeight}px`;
      wrapper.appendChild(overlayLayer);

      try {
        const annotations = await page.getAnnotations({ intent: 'display' });
        if (gen !== renderGeneration || wrapper.dataset.rendered !== 'true') return;

        const links = annotations.filter(a => a.subtype === 'Link' && (a.dest || a.url));
        for (const link of links) {
          if (!link.rect || link.rect.length < 4) continue;
          const rect = cssViewport.convertToViewportRectangle(link.rect);
          const left = Math.min(rect[0], rect[2]);
          const top = Math.min(rect[1], rect[3]);
          const width = Math.abs(rect[2] - rect[0]);
          const height = Math.abs(rect[3] - rect[1]);

          if (width < 2 || height < 2) continue;

          const a = document.createElement('a');
          a.className = 'pdf-link-item';
          a.style.left = `${left}px`;
          a.style.top = `${top}px`;
          a.style.width = `${width}px`;
          a.style.height = `${height}px`;

          if (link.dest) {
            a.title = 'Ir para seção vinculada';
            a.addEventListener('click', async (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              const destPage = await resolvePdfDestinationPage(link.dest);
              if (destPage) {
                jumpToPage(destPage);
              }
            });
          } else if (link.url) {
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.title = link.url;
            a.addEventListener('click', (ev) => ev.stopPropagation());
          }

          overlayLayer.appendChild(a);
        }
      } catch (e) {}

      refreshVisibleSearchHighlights();
    }

    async function renderPageIntoWrapper(pageNum, wrapper, scale, gen, maxCropWidth = null) {
      if (gen !== renderGeneration || !pdfInstance) return;
      try {
        const page = await pdfInstance.getPage(pageNum);
        if (gen !== renderGeneration || wrapper.dataset.rendered !== 'true') return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });
        const cssViewport = page.getViewport({ scale });
        const unscaledViewport = page.getViewport({ scale: 1 });

        const cssWidth = viewport.width / dpr;
        const cssHeight = viewport.height / dpr;

        wrapper.dataset.renderScale = scale;
        wrapper.dataset.pdfHeight = unscaledViewport.height;

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;

        wrapper.style.width = maxCropWidth ? `${Math.min(cssWidth, maxCropWidth)}px` : `${cssWidth}px`;
        wrapper.style.height = `${cssHeight}px`;

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        if (gen !== renderGeneration || wrapper.dataset.rendered !== 'true') {
          canvas.width = 0;
          canvas.height = 0;
          return;
        }
        wrapper.innerHTML = '';
        wrapper.appendChild(canvas);

        await renderAnnotationsAndOverlays(page, cssViewport, wrapper, cssWidth, cssHeight, gen);
      } catch (e) {
        wrapper.dataset.rendered = '';
      }
    }

    function scrollToPageElement(pageNum, behavior = 'smooth') {
      const targetEl = document.querySelector(`.page-wrapper[data-page="${pageNum}"]`);
      if (targetEl) {
        if (readerPrefs.direction === 'vertical') {
          const area = document.getElementById('canvasArea');
          area.scrollTo({
            top: targetEl.offsetTop - 10,
            left: readerPrefs.locked ? lockedScrollLeft : area.scrollLeft,
            behavior
          });
        } else {
          targetEl.scrollIntoView({ behavior, block: 'start', inline: 'center' });
        }
      }
    }

    function updateCurrentPageState(num) {
      if (!pdfInstance || !activeDoc) return;
      currentPage = num;
      document.getElementById('pageInput').value = num;
      document.getElementById('immersivePill').textContent = `${num} / ${pdfInstance.numPages}`;
      document.getElementById('prevPageBtn').disabled = num <= 1;
      document.getElementById('nextPageBtn').disabled = num >= pdfInstance.numPages;

      activeDoc.paginaAtual = num;
      activeDoc.totalPaginas = pdfInstance.numPages;
      activeDoc.progresso = Math.round((num / pdfInstance.numPages) * 100);
      activeDoc.ultimaLeitura = Date.now();

      clearTimeout(saveProgressTimer);
      saveProgressTimer = setTimeout(async () => {
        await saveRecordToDB(activeDoc);
        renderContinueReading();
        renderDocs();
      }, 450);
    }

    function changePage(delta) {
      if (!pdfInstance) return;
      const target = currentPage + delta;
      if (target >= 1 && target <= pdfInstance.numPages) {
        if (readerPrefs.flow === 'single') {
          rebuildReaderViewport(target, 0);
        } else {
          scrollToPageElement(target, 'smooth');
          updateCurrentPageState(target);
        }
      }
    }

    async function jumpToPageAsync(val) {
      if (!pdfInstance) return;
      const num = parseInt(val);
      if (!isNaN(num) && num >= 1 && num <= pdfInstance.numPages) {
        if (readerPrefs.flow === 'single') {
          await rebuildReaderViewport(num, 0);
        } else {
          isProgrammaticScroll = true;
          scrollToPageElement(num, 'auto');
          updateCurrentPageState(num);
          setTimeout(() => { isProgrammaticScroll = false; }, 220);
        }
      } else {
        document.getElementById('pageInput').value = currentPage;
      }
    }

    function jumpToPage(val) {
      jumpToPageAsync(val);
    }

    function adjustZoom(delta) {
      if (readerPrefs.locked) return;
      const ratio = getRelativePageScrollRatio();
      zoomMultiplier = Math.min(3.0, Math.max(0.6, +(zoomMultiplier + delta).toFixed(2)));
      applyReaderPreferencesUI();
      rebuildReaderViewport(currentPage, ratio);
    }

    function resetZoom() {
      if (readerPrefs.locked || zoomMultiplier === 1.0) return;
      const ratio = getRelativePageScrollRatio();
      zoomMultiplier = 1.0;
      lockedScrollLeft = 0;
      applyReaderPreferencesUI();
      rebuildReaderViewport(currentPage, ratio);
    }

    // =====================================================================
    // SEÇÃO 12: MARCADORES, SUMÁRIO INTERNO E GESTOS/ATALHOS DE LEITURA
    // - CRUD de marcadores pessoais, navegação pelo sumário embutido do PDF,
    //   toque/clique na tela, pinça de zoom, atalhos de teclado e fechamento.
    // =====================================================================
    function updateBookmarksCounter() {
      const count = activeDoc && activeDoc.marcadores ? activeDoc.marcadores.length : 0;
      document.getElementById('openBookmarksBtn').textContent = `🔖 ${count}`;
    }

    async function addBookmarkPrompt() {
      if (!activeDoc) return;
      const nota = prompt(`Nota para o marcador na Página ${currentPage} (opcional):`, `Página ${currentPage}`);
      if (nota === null) return;

      activeDoc.marcadores.push({
        id: Date.now(),
        pagina: currentPage,
        nota: nota.trim() || `Página ${currentPage}`
      });
      activeDoc.marcadores.sort((a, b) => a.pagina - b.pagina);
      await saveRecordToDB(activeDoc);
      updateBookmarksCounter();
    }

    function switchBookmarkTab(tab) {
      currentBookmarkTab = tab;
      document.getElementById('tabUserBookmarks').classList.toggle('active', tab === 'user');
      document.getElementById('tabPdfOutline').classList.toggle('active', tab === 'outline');
      document.getElementById('addBmModalBtn').style.display = tab === 'user' ? 'inline-block' : 'none';
      renderBookmarksModalContent();
    }

    function openBookmarksModal() {
      if (!activeDoc) return;
      currentBookmarkTab = 'user';
      switchBookmarkTab('user');
      document.getElementById('bookmarksModal').classList.add('open');
    }

    function renderBookmarksModalContent() {
      const list = document.getElementById('bookmarksList');

      if (currentBookmarkTab === 'outline') {
        if (!pdfOutlineItems.length) {
          list.innerHTML = `<div class="empty-state" style="padding:20px 10px;">Este PDF não possui sumário interno embutido.</div>`;
          return;
        }
        list.innerHTML = pdfOutlineItems.map(item => `
          <div class="bm-item" style="margin-left: ${item.level * 12}px;">
            <div class="bm-item-info" onclick="${item.page ? `goToBookmark(${item.page})` : ''}">
              <div class="bm-item-note" style="font-weight:500;">${item.title}</div>
              ${item.page ? `<div class="bm-item-page">Página ${item.page}</div>` : ''}
            </div>
          </div>
        `).join('');
        return;
      }

      const bms = activeDoc.marcadores || [];
      if (bms.length === 0) {
        list.innerHTML = `<div class="empty-state" style="padding:20px 10px;">Nenhum marcador salvo nesta obra ainda.</div>`;
      } else {
        list.innerHTML = bms.map(b => `
          <div class="bm-item">
            <div class="bm-item-info" onclick="goToBookmark(${b.pagina})">
              <div class="bm-item-page">Página ${b.pagina}</div>
              <div class="bm-item-note">${b.nota}</div>
            </div>
            <button class="ext-btn" onclick="deleteBookmark(${b.id})">✕</button>
          </div>
        `).join('');
      }
    }

    function closeBookmarksModal() {
      document.getElementById('bookmarksModal').classList.remove('open');
    }

    function goToBookmark(page) {
      closeBookmarksModal();
      jumpToPage(page);
    }

    async function deleteBookmark(bmId) {
      if (!activeDoc) return;
      activeDoc.marcadores = activeDoc.marcadores.filter(b => b.id !== bmId);
      await saveRecordToDB(activeDoc);
      updateBookmarksCounter();
      renderBookmarksModalContent();
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let wasMultiTouch = false;
    let pinchStartDist = 0;
    let pinchCurrentScale = 1;
    let lastScrollTop = 0;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastTouchEndTime = 0;

    const canvasAreaEl = document.getElementById('canvasArea');

    function getTouchDistance(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function handleReaderSurfaceTap(clientX) {
      const screenW = window.innerWidth;
      if (readerPrefs.flow === 'single' && zoomMultiplier <= 1.05) {
        if (clientX < screenW * 0.22) {
          changePage(-1);
          return;
        }
        if (clientX > screenW * 0.78) {
          changePage(1);
          return;
        }
      }

      const overlay = document.getElementById('readerOverlay');
      if (overlay.classList.contains('immersive')) {
        const showHud = !overlay.classList.contains('hud-visible');
        overlay.classList.toggle('hud-visible', showHud);
        document.getElementById('readerSettingsBar').classList.toggle('open', showHud);
      } else {
        enterImmersiveMode();
      }
    }

    canvasAreaEl.addEventListener('mousedown', (e) => {
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
    });

    canvasAreaEl.addEventListener('click', (e) => {
      if (e.target.closest('.pdf-link-item')) return;
      if (Date.now() - lastTouchEndTime < 500) return;
      if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 6) return;
      handleReaderSurfaceTap(e.clientX);
    });

    canvasAreaEl.addEventListener('wheel', (e) => {
      if (readerPrefs.locked) {
        if (e.ctrlKey || Math.abs(e.deltaX) > 0) {
          e.preventDefault();
        }
      }
    }, { passive: false });

    canvasAreaEl.addEventListener('touchstart', (e) => {
      if (e.touches.length >= 2) {
        wasMultiTouch = true;
        if (!readerPrefs.locked) {
          pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
          pinchCurrentScale = 1;
        }
        return;
      }
      if (e.touches.length === 1 && !wasMultiTouch) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    canvasAreaEl.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2 && !readerPrefs.locked && pinchStartDist > 0) {
        e.preventDefault();
        const dist = getTouchDistance(e.touches[0], e.touches[1]);
        pinchCurrentScale = Math.max(0.6, Math.min(2.4, dist / pinchStartDist));
        const activeWrapper = document.querySelector(`.page-wrapper[data-page="${currentPage}"]`);
        if (activeWrapper) {
          activeWrapper.style.transform = `scale(${pinchCurrentScale})`;
        }
      }
    }, { passive: false });

    canvasAreaEl.addEventListener('touchend', (e) => {
      if (wasMultiTouch) {
        if (e.touches.length === 0) {
          wasMultiTouch = false;
          if (!readerPrefs.locked && pinchStartDist > 0 && Math.abs(pinchCurrentScale - 1) > 0.08) {
            const ratio = getRelativePageScrollRatio();
            zoomMultiplier = Math.min(3.0, Math.max(0.6, +(zoomMultiplier * pinchCurrentScale).toFixed(2)));
            pinchStartDist = 0;
            pinchCurrentScale = 1;
            applyReaderPreferencesUI();
            rebuildReaderViewport(currentPage, ratio);
          } else {
            document.querySelectorAll('.page-wrapper').forEach(w => w.style.transform = '');
            pinchStartDist = 0;
            pinchCurrentScale = 1;
          }
        }
        return;
      }

      if (e.changedTouches.length !== 1) return;
      if (e.target.closest('.pdf-link-item')) return;

      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const diffX = endX - touchStartX;
      const diffY = endY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10 && elapsed < 320) {
        lastTouchEndTime = Date.now();
        handleReaderSurfaceTap(endX);
        return;
      }

      if (!readerPrefs.locked && readerPrefs.flow === 'single' && zoomMultiplier <= 1.05 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < -55) changePage(1);
        if (diffX > 55) changePage(-1);
      }
    }, { passive: true });

    canvasAreaEl.addEventListener('scroll', () => {
      if (readerPrefs.locked && readerPrefs.direction === 'vertical' && canvasAreaEl.scrollLeft !== lockedScrollLeft) {
        canvasAreaEl.scrollLeft = lockedScrollLeft;
      }

      if (isProgrammaticScroll || readerPrefs.direction !== 'vertical') return;
      const st = canvasAreaEl.scrollTop;
      const overlay = document.getElementById('readerOverlay');

      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
      if (isTouchDevice && st - lastScrollTop > 55 && st > 90) {
        if (overlay.classList.contains('immersive')) {
          overlay.classList.remove('hud-visible');
          document.getElementById('readerSettingsBar').classList.remove('open');
        }
      }
      lastScrollTop = st;
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (!activeDoc) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        const bar = document.getElementById('readerSearchBar');
        if (!bar.classList.contains('open')) {
          togglePdfSearchBar();
        } else {
          document.getElementById('pdfSearchInput').focus();
          document.getElementById('pdfSearchInput').select();
        }
        return;
      }
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        changePage(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        changePage(-1);
      } else if (e.key === 'Escape') {
        if (document.getElementById('readerSearchBar').classList.contains('open')) {
          closePdfSearchBar();
          return;
        }
        const overlay = document.getElementById('readerOverlay');
        if (overlay.classList.contains('immersive')) {
          exitImmersiveMode();
        }
      }
    });

    function closeIntegratedReader() {
      if (lazyObserver) lazyObserver.disconnect();
      if (activePageObserver) activePageObserver.disconnect();
      releaseScreenWakeLock();
      wasNativeFullscreen = false;
      exitSystemFullscreen();

      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (e) {}

      const area = document.getElementById('canvasArea');
      area.querySelectorAll('canvas').forEach(c => { c.width = 0; c.height = 0; });
      area.innerHTML = '';

      document.getElementById('readerOverlay').classList.remove('open', 'immersive', 'hud-visible');
      document.getElementById('viewportMeta').setAttribute(
        'content',
        'width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover'
      );
      pdfInstance = null;
      activeDoc = null;
    }
  </script>
</body>
</html>
